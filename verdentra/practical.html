    function UserLoader() {
  const [user, setUser] = React.useState(null);
  const [loading, setLoading] = React.useState(true);

  // useEffect runs AFTER the component renders
  // The [] means "run once when component first appears"
  console.log('before use effect');
  React.useEffect(() => {
    // Simulate an API call with a timeout
    setTimeout(() => {
      console.log('inisde the use effect');
      
      setUser({ name: 'Gimhana', role: 'Developer' });
      setLoading(false);
    }, 1500);
  }, []); // <-- empty array = run once

  if (loading) return <p>Loading...</p>;
  return (

    <div>
      <div>
        <p>Hello, {user.name}! Role: {user.role}</p>;
        </div>
        <div>
          <button onClick={()=> {setUser({ name: 'Gimhssssana', role: 'Developer' }); }}>Button 1</button>
          
          </div>
          </div>
        );

}
    ReactDOM.createRoot(document.getElementById('root')).render(<UserLoader />);
